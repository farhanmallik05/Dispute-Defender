services:
  - type: web
    name: dispute-defender
    env: node
    plan: starter
    region: oregon
    rootDir: dispute-defender
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: dispute-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /data/dispute-defender.sqlite
      - key: INTEGRITY_MODE
        value: live
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
